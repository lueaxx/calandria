[project]
name = "calandria"
version = "1.0.0"
description = "Live transcription and translation for conferences, at conference scale."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Gonzalo Rojas" }]
keywords = ["accessibility", "captions", "subtitles", "transcription", "translation", "conference"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Adaptive Technologies",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
  "google-genai>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
calandria = "calandria.__main__:main"

[project.urls]
Homepage = "https://github.com/lueaxx/calandria"
Issues = "https://github.com/lueaxx/calandria/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["calandria*"]

[tool.setuptools.package-data]
calandria = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
